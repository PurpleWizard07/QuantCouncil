# QuantCouncil Alembic configuration.
#
# Run from the REPO ROOT:
#
#     alembic -c infra/alembic.ini upgrade head
#
# sqlalchemy.url is intentionally EMPTY here: infra/migrations/env.py resolves
# the database URL at runtime -- ALEMBIC_DATABASE_URL env var if set, else
# app.core.config.get_settings().database_url (which loads the repo-root
# .env). Never hardcode credentials in this file.

[alembic]
script_location = infra/migrations
sqlalchemy.url =

# Timezone-naive, sortable revision file names.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
