[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcouncil-agents"
version = "0.1.0"
description = "QuantCouncil AI committee agents: strict-JSON schemas and role stubs. Agents reason and propose; they never calculate and never override risk."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["agents*"]
