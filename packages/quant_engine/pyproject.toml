[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcouncil-quant-engine"
version = "0.1.0"
description = "Deterministic quant calculations for QuantCouncil: indicators, signals, backtesting, metrics. The source of truth."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["quant_engine*"]
