[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcouncil-risk-engine"
version = "0.1.0"
description = "Deterministic risk engine for QuantCouncil with veto power over all paper-trade decisions."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["risk_engine*"]
