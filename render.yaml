# Render Blueprint for the QuantCouncil API.
# Deploy: on render.com, "New +" -> "Blueprint" -> connect this repo -> it
# reads this file and provisions the web service + database together.
#
# NEXT_PUBLIC_API_URL on the Netlify site must be set to this service's URL
# (shown on its Render dashboard page) after the first deploy, then Netlify
# needs a rebuild since Next.js inlines NEXT_PUBLIC_ vars at build time.

databases:
  - name: quantcouncil-db
    plan: free
    databaseName: quantcouncil
    user: quant

services:
  - type: web
    name: quantcouncil-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://quantcouncil.netlify.app
      - key: QUANTCOUNCIL_AGENT_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: quantcouncil-db
          property: connectionString
